name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  dist-em-sincronia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A CDN serve dist/ direto do commit da tag: se o dist commitado não
      # for o que o src/ gera, a tag publica um bundle fantasma.
      - run: npm run check
